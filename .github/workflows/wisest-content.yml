name: Wisest Content Generation

on:
  workflow_dispatch:
    inputs:
      target_file:
        description: 'Path to topic file (e.g. lib/data/questions/Year_2_A_Level_Maths/Differentiation/d1.ts)'
        required: true
        type: string
      mode:
        description: 'Task to run'
        required: true
        type: choice
        options:
          - check
          - expand
          - check-and-expand
          - render-sweep
        default: check
      slice:
        description: 'Optional question-ID range, e.g. "01-30" or "31-60". Leave blank for all.'
        required: false
        type: string
        default: ''

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: >-
            --max-turns 240
            --model claude-opus-4-7
            --allowedTools "Bash,Edit,Read,Write,Glob,Grep"
          prompt: |
            Read `.claude/AGENT_INSTRUCTIONS.md` first and follow it exactly.

            Inputs:
              mode:        ${{ inputs.mode }}
              target_file: ${{ inputs.target_file }}
              slice:       ${{ inputs.slice }}

            Workflow run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            At the end, you MUST:
              1. Run `npx tsc --noEmit` (use `npm ci --omit=optional --no-audit` first if node_modules is missing). If it errors in `target_file`, fix or revert.
              2. `git config user.name "wisest-bot"` and `git config user.email "wisest-bot@users.noreply.github.com"`.
              3. Create a branch `wisest/${{ inputs.mode }}/${{ github.run_id }}` and commit your changes (or for `check` mode with no file changes, commit a single placeholder file `.wisest/checks/${{ github.run_id }}.md` containing the report).
              4. `git push -u origin HEAD`.
              5. `gh pr create --base main --title "Wisest [${{ inputs.mode }}] ${{ inputs.target_file }}" --body "<full report/fix-log>"`.
            Do not commit directly to `main`.
